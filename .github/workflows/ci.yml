name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MEDIA_REPO: https://git.linuxtv.org/media.git
  MEDIA_SHA: aa0f4c41d4870a18e65772a1817af16427200371

jobs:
  checkpatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Fetch checkpatch from the pinned media tree
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/media"
          git -C "$RUNNER_TEMP/media" remote add origin "$MEDIA_REPO"
          git -C "$RUNNER_TEMP/media" fetch --depth 1 origin "$MEDIA_SHA"
          git -C "$RUNNER_TEMP/media" checkout --detach FETCH_HEAD

      - name: Run checkpatch
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/media/scripts/checkpatch.pl"
          "$CP" --no-tree --strict -f s5k4h8.c
          # A path that `git ls-files` returns is checked as a source file
          # (diff against /dev/null), not as a kernel series. These files
          # are tracked, so a blank diff context line and the format-patch
          # signature look like trailing whitespace. Parse them from a
          # directory that is not this repository.
          work=$(mktemp -d)
          cp patches/0001-*.patch patches/0002-*.patch "$work/"
          (
            cd "$work"
            "$CP" --no-tree --strict ./*.patch
          )

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev

      - name: Fetch the pinned media tree
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/media"
          git -C "$RUNNER_TEMP/media" remote add origin "$MEDIA_REPO"
          git -C "$RUNNER_TEMP/media" fetch --depth 1 origin "$MEDIA_SHA"
          git -C "$RUNNER_TEMP/media" checkout --detach FETCH_HEAD

      - name: Apply the series
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/media" config user.name "ci"
          git -C "$RUNNER_TEMP/media" config user.email "ci@example.com"
          git -C "$RUNNER_TEMP/media" am \
            "$GITHUB_WORKSPACE"/patches/0001-*.patch \
            "$GITHUB_WORKSPACE"/patches/0002-*.patch

      - name: Compile s5k4h8.o
        working-directory: ${{ runner.temp }}/media
        run: |
          set -euo pipefail
          make defconfig
          ./scripts/config --enable COMMON_CLK
          ./scripts/config --enable MEDIA_SUPPORT
          ./scripts/config --enable MEDIA_CAMERA_SUPPORT
          ./scripts/config --enable VIDEO_DEV
          ./scripts/config --enable VIDEO_CAMERA_SENSOR
          ./scripts/config --module VIDEO_S5K4H8
          make olddefconfig
          grep -q '^CONFIG_VIDEO_S5K4H8=m$' .config
          grep -q '^CONFIG_V4L2_CCI_I2C=m$' .config
          make -j"$(nproc)" modules_prepare
          make -j"$(nproc)" drivers/media/i2c/s5k4h8.o
          test -f drivers/media/i2c/s5k4h8.o
